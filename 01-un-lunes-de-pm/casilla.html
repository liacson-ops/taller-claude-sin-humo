<style>
  /* Casilla de correo SIMULADA para el taller. Todos los datos son ficticios. */
  :root { --bg: #F6F6F4; --line: #DEDCD6; --ink: #1B1B1A; --mute: #6B6862; --acc: #D97757; --sel: #FBEDE7; --card: #fff; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font: 15px/1.45 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--ink); background: var(--bg); height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 14px; padding: 10px 16px; background: var(--card); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 17px; font-weight: 700; }
  header .who { color: var(--mute); font-size: 13px; }
  header input { flex: 1; min-width: 180px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; font: inherit; }
  button { font: 600 13px/1 inherit; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--ink); background: var(--ink); color: #fff; cursor: pointer; }
  button.alt { background: #fff; color: var(--ink); }
  .aviso { background: #FFF6D6; border-bottom: 1px solid #EAD98F; padding: 6px 16px; font-size: 13px; }
  main { flex: 1; display: grid; grid-template-columns: minmax(280px, 420px) 1fr; min-height: 0; }
  #lista { overflow-y: auto; border-right: 1px solid var(--line); background: var(--card); }
  .item { padding: 10px 14px; border-bottom: 1px solid var(--line); cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; }
  .item:hover { background: #FAFAF8; }
  .item.sel { background: var(--sel); }
  .item.nuevo .de, .item.nuevo .asunto { font-weight: 700; }
  .item .de { font-size: 14px; }
  .item .hora { font-size: 12px; color: var(--mute); }
  .item .asunto { grid-column: 1 / -1; font-size: 14px; }
  .item .prev { grid-column: 1 / -1; font-size: 13px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 4px; margin-right: 4px; background: #EEE; color: #555; }
  .tag.adj { background: #E7EEF9; color: #2A4E86; }
  .tag.ext { background: #FBEDE7; color: #9A4426; }
  #lectura { overflow-y: auto; padding: 24px 30px; }
  #lectura h2 { font-size: 21px; margin-bottom: 10px; }
  #lectura .meta { color: var(--mute); font-size: 13px; margin-bottom: 18px; line-height: 1.6; }
  #lectura .cuerpo { white-space: pre-wrap; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; max-width: 820px; }
  #lectura .adjunto { margin-top: 12px; font-size: 13px; color: var(--mute); }
  .vacio { color: var(--mute); padding: 40px; }
  #toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 14px; display: none; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } #lectura { display: none; } main.leyendo #lista { display: none; } main.leyendo #lectura { display: block; padding: 16px; } }
</style>

const lista = document.getElementById('lista'), lectura = document.getElementById('lectura'), main = document.getElementById('main');
let sel = null;
function pintar(f = '') {
  const q = f.trim().toLowerCase();
  lista.innerHTML = '';
  MAILS.filter(m => !q || (m.de + m.asunto + m.cuerpo).toLowerCase().includes(q)).forEach(m => {
    const d = document.createElement('div');
    d.className = 'item' + (m.nuevo ? ' nuevo' : '') + (sel === m.id ? ' sel' : '');
    d.innerHTML = `<span class="de"></span><span class="hora"></span><span class="asunto"></span><span class="prev"></span>`;
    d.querySelector('.de').textContent = m.de;
    d.querySelector('.hora').textContent = m.fecha;
    const a = d.querySelector('.asunto');
    if (m.ext) a.insertAdjacentHTML('beforeend', '<span class="tag ext">externo</span>');
    if (m.adj) a.insertAdjacentHTML('beforeend', '<span class="tag adj">📎 adjunto</span>');
    a.append(document.createTextNode(m.asunto));
    d.querySelector('.prev').textContent = m.cuerpo.replace(/\s+/g, ' ').slice(0, 120);
    d.onclick = () => abrir(m);
    lista.appendChild(d);
  });
}
function abrir(m) {
  sel = m.id; m.nuevo = false; pintar(document.getElementById('buscar').value);
  lectura.innerHTML = '';
  const h = document.createElement('h2'); h.textContent = m.asunto;
  const meta = document.createElement('div'); meta.className = 'meta';
  meta.innerText = `De: ${m.de} <${m.mail}>\nPara: ${m.para}${m.cc ? `\nCC: ${m.cc}` : ''}\nFecha: ${m.fecha}`;
  const c = document.createElement('div'); c.className = 'cuerpo'; c.textContent = m.cuerpo;
  lectura.append(h, meta, c);
  if (m.adj) { const a = document.createElement('div'); a.className = 'adjunto'; a.textContent = '📎 ' + m.adj + ' (simulado)'; lectura.append(a); }
  main.classList.add('leyendo');
}
function comoTexto() {
  return 'CASILLA DE CORREO DE CARLA MÉNDEZ (Project Manager, Nimbus Software) · lunes 19/10, 8:40\n' +
    MAILS.length + ' mails. Datos ficticios para un taller.\n\n' +
    MAILS.map(m => `--- MAIL ${m.id} ---\nDe: ${m.de} <${m.mail}>\nPara: ${m.para}${m.cc ? `\nCC: ${m.cc}` : ''}\nFecha: ${m.fecha}\nAsunto: ${m.asunto}${m.adj ? `\nAdjunto: ${m.adj}` : ''}\n\n${m.cuerpo}\n`).join('\n');
}
const toast = (t) => { const el = document.getElementById('toast'); el.textContent = t; el.style.display = 'block'; setTimeout(() => el.style.display = 'none', 2600); };
document.getElementById('copiar').onclick = async () => {
  try { await navigator.clipboard.writeText(comoTexto()); toast('Copiado: ' + MAILS.length + ' mails. Pegalo en Claude.'); }
  catch (e) { prompt('Copiá este texto:', comoTexto()); }
};
document.getElementById('bajar').onclick = () => {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([comoTexto()], { type: 'text/plain;charset=utf-8' }));
  a.download = 'casilla-carla-mendez.txt'; a.click();
};
document.getElementById('buscar').oninput = (e) => pintar(e.target.value);
pintar();
</script>
